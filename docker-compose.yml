services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - /app/node_modules
    command: node --watch server.js

  proxy:
    image: caddy:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    depends_on:
      - app

  turn:
    image: coturn/coturn:alpine
    restart: unless-stopped
    network_mode: host
    command: >
      -n --log-file=stdout
      --min-port=49152 --max-port=65535
      --user=aerobeam:aerobeam2026
      --realm=aerobeam.local
      --no-tls --no-dtls

  vosk:
    image: alphacep/kaldi-en:latest
    restart: unless-stopped
    ports:
      - "2700:2700"
    volumes:
      - vosk_model:/opt/vosk-model-en
    command: >
      /bin/bash -c "
      if [ ! -f /opt/vosk-model-en/am/final.mdl ]; then
        echo 'Downloading small model...';
        cd /tmp;
        wget -q https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip;
        unzip -q vosk-model-small-en-us-0.15.zip;
        mv vosk-model-small-en-us-0.15/* /opt/vosk-model-en/;
        rm -rf vosk-model-small-en-us-0.15*;
      fi;
      python3 /opt/vosk-server/websocket/asr_server.py /opt/vosk-model-en
      "

volumes:
  caddy_data:
  vosk_model:
