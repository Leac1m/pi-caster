services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - /app/node_modules
    command: node --watch server.js

  proxy:
    image: caddy:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    depends_on:
      - app

  turn:
    image: coturn/coturn:alpine
    restart: unless-stopped
    network_mode: host
    command: >
      -n --log-file=stdout
      --min-port=49152 --max-port=65535
      --user=aerobeam:aerobeam2026
      --realm=aerobeam.local
      --no-tls --no-dtls

volumes:
  caddy_data:
