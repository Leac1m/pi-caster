<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AeroBeam - Receiver</title>
    <link rel="stylesheet" href="style.css">
    <script src="/socket.io/socket.io.js"></script>
    <script src="/vendor/qrcode.min.js"></script>

    <style>
        #pdf-render {
            display: none;
            max-width: 100%;
            max-height: 100%;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body class="receiver-body">
    <div id="video-container">
        <div class="waiting-overlay" id="waiting-overlay" style="background: url('AEROBEAMpages.svg') no-repeat center center; background-size: 100% 100%;">
            <div class="spinner" id="connecting-spinner" style="display: none;"></div>
            <h1 id="overlay-title" style="display: none;">AeroBeam is Starting…</h1>
            <p id="overlay-subtitle" style="display: none;">Waiting for server to come online…</p>
        </div>
        <video id="remote-video" autoplay playsinline muted></video>
        <div id="viewer-container" style="width: 100%; height: 100%; display: none;"></div>
    </div>

    <script>
        window.FileReaderJS = {
            setSync: function() {},
            setupInput: function() {},
            setupDrop: function() {},
            setupBlob: function(blob, options) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    if (options.on && options.on.load) {
                        options.on.load(e, blob);
                    }
                };
                if (options.readAsDefault === "ArrayBuffer") {
                    reader.readAsArrayBuffer(blob);
                } else {
                    reader.readAsText(blob);
                }
            }
        };
        
        const socket = io({
            reconnection: true,
            reconnectionAttempts: Infinity,
            reconnectionDelay: 1000,
            reconnectionDelayMax: 5000
        });
        let peerConnection;
        let pendingCandidates = [];
        const remoteVideo = document.getElementById('remote-video');
        
        const waitingOverlay = document.getElementById('waiting-overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const overlaySubtitle = document.getElementById('overlay-subtitle');
        const connectingSpinner = document.getElementById('connecting-spinner');

        const WIFI_PAYLOAD = 'WIFI:T:WPA;S:AeroBeam;P:AeroBeam2026;;';

        const configuration = {
            'iceServers': []
        };

        // Show QR immediately — hotspot credentials are static.
        // The dynamic IP (for non-hotspot mode) is fetched below.
        function showReadyState(localIp) {
            connectingSpinner.style.display = 'none';
            overlayTitle.textContent = 'AeroBeam is Ready';
            overlaySubtitle.textContent = 'Scan to join AeroBeam Wi-Fi and start casting';
        }

        // Try to fetch the server's IP; if server is down this is a no-op.
        // The QR is always shown regardless — hotspot creds are static.
        async function fetchServerIp() {
            try {
                const res = await fetch('/api/ip');
                if (!res.ok) throw new Error('server error');
                const data = await res.json();
                showReadyState(data.ip);
            } catch (_) {
                // Server not reachable yet — show QR with no dynamic IP.
                // Socket.io will eventually connect and call showReadyState again
                // with the real IP if the server comes up.
                console.warn('Server not reachable yet — showing QR with static credentials.');
                showReadyState(null);
            }
        }

        socket.on('connect', () => {
            console.log('Connected to signaling server');
            socket.emit('register-receiver');
            fetchServerIp();
        });

        socket.on('disconnect', () => {
            console.log('Disconnected from signaling server');
        });

        // If socket was already connected before this script ran (page reload mid-session),
        // the 'connect' event already fired. Handle that case.
        if (socket.connected) {
            socket.emit('register-receiver');
            fetchServerIp();
        } else {
            // Server is not yet reachable — show QR immediately with static hotspot creds
            // so the display is never blank/dark while waiting for the server to boot.
            showReadyState(null);
        }

        let viewerClient = null;
        let viewerInstance = null;
        
        let pendingPresentation = null;
        
        import('/vendor/udoc-viewer.bundle.js').then(async (mod) => {
            viewerClient = await mod.UDocClient.create({
                baseUrl: window.location.origin + '/vendor/udoc-assets/',
                googleFonts: false
            });
            viewerInstance = await viewerClient.createViewer({
                container: '#viewer-container',
                hideToolbar: true,
                hideFloatingToolbar: true,
                disableLeftPanel: true,
                disableRightPanel: true,
                scrollMode: 'continuous',
                zoomMode: 'fit-spread'
            });
            
            // Sync page number
            viewerInstance.on('page-changed', (e) => {
                currentPageNum = e.page;
                socket.emit('page_changed', { slide: e.page });
            });

            if (pendingPresentation) {
                const data = pendingPresentation;
                pendingPresentation = null;
                try {
                    await viewerInstance.load(data.fileUrl);
                    if (data.slide) viewerInstance.goToPage(data.slide);
                    document.getElementById('preview-loading').style.display = 'none';
                    document.getElementById('viewer-container').style.display = 'block';
                } catch (err) {
                    console.error("Error loading document:", err);
                }
            }
        }).catch(err => console.error('Failed to load udoc-viewer', err));

        socket.on('presentation-start', async (data) => {
            console.log("Starting presentation:", data.fileUrl);
            resetVideo();
            waitingOverlay.classList.add('hidden');
            remoteVideo.style.display = 'none';
            
            const container = document.getElementById('viewer-container');
            container.style.display = 'block';

            if (viewerInstance) {
                try {
                    await viewerInstance.load(data.fileUrl);
                    if (data.slide) {
                        viewerInstance.goToPage(data.slide);
                    }
                } catch (err) {
                    console.error("Error loading document:", err);
                    resetAll();
                }
            } else {
                console.log("Viewer not initialized yet. Queuing presentation.");
                pendingPresentation = data;
            }
        });



        socket.on('slide-next', () => {
            if (viewerInstance && viewerInstance.isLoaded && viewerInstance.currentPage < viewerInstance.pageCount) {
                viewerInstance.nextPage();
            }
        });

        socket.on('slide-prev', () => {
            if (viewerInstance && viewerInstance.isLoaded && viewerInstance.currentPage > 1) {
                viewerInstance.previousPage();
            }
        });



        socket.on('presentation-stop', () => {
            console.log("Stopping presentation");
            resetAll();
        });


        /* --- WebRTC Screen Share Logic --- */
        socket.on('stop-screen-share', () => {
            console.log('Received stop-screen-share');
            resetAll();
        });

        socket.on('offer', async (data) => {
            console.log('Received offer from', data.senderId);
            
            if (!peerConnection) {
                peerConnection = new RTCPeerConnection(configuration);

                peerConnection.ontrack = event => {
                    console.log('Received track');
                    if (remoteVideo.srcObject !== event.streams[0]) {
                        // Only reset the PDF display, DO NOT reset the video/connection!
                        if (viewerInstance) viewerInstance.close();
                        document.getElementById('viewer-container').style.display = 'none';
                        
                        remoteVideo.style.display = 'block';
                        remoteVideo.srcObject = event.streams[0];
                        waitingOverlay.classList.add('hidden');
                    }
                };

                peerConnection.onicecandidate = event => {
                    if (event.candidate) {
                        socket.emit('ice-candidate', { targetId: data.senderId, candidate: event.candidate });
                    }
                };

                peerConnection.onconnectionstatechange = () => {
                    if (peerConnection.connectionState === 'failed') {
                        resetAll();
                    }
                };
            }

            try {
                await peerConnection.setRemoteDescription(new RTCSessionDescription({ type: 'offer', sdp: data.sdp }));
                
                for (const c of pendingCandidates) {
                    await peerConnection.addIceCandidate(new RTCIceCandidate(c));
                }
                pendingCandidates = [];

                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);
                
                socket.emit('answer', { sdp: peerConnection.localDescription.sdp, senderId: data.senderId });
            } catch (e) {
                console.error("Error handling offer", e);
            }
        });

        socket.on('ice-candidate', async (data) => {
            try {
                if (peerConnection && data.candidate) {
                    if (!peerConnection.remoteDescription) {
                        pendingCandidates.push(data.candidate);
                    } else {
                        await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
                    }
                }
            } catch (e) {
                console.error('Error adding received ice candidate', e);
            }
        });

        function resetVideo() {
            remoteVideo.srcObject = null;
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
        }

        function resetAll() {
            resetVideo();
            if (viewerInstance) viewerInstance.close();
            document.getElementById('viewer-container').style.display = 'none';
            remoteVideo.style.display = 'block'; // reset to default
            waitingOverlay.classList.remove('hidden');
        }

        // Kiosk escape: ESC or Ctrl+Shift+Escape calls the server exit endpoint.
        // On success the kiosk Chromium process is killed and the desktop is restored.
        const KIOSK_EXIT_TOKEN = 'pi-caster-kiosk-exit'; // matches server.js default

        async function exitKiosk() {
            try {
                const res = await fetch('/api/exit-kiosk', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Exit-Token': KIOSK_EXIT_TOKEN,
                    },
                });
                if (!res.ok) {
                    console.warn('Kiosk exit returned', res.status);
                }
            } catch (err) {
                console.error('Kiosk exit failed:', err);
            }
        }

        document.addEventListener('keydown', (e) => {
            // Ctrl + Shift + Escape  OR  plain Escape — both trigger exit
            if ((e.ctrlKey && e.shiftKey && e.key === 'Escape') || e.key === 'Escape') {
                e.preventDefault();
                console.log('Kiosk escape triggered.');
                exitKiosk();
                // Fallback: also try window.close() in case this isn't true kiosk mode
                setTimeout(() => { try { window.close(); } catch (_) {} }, 500);
            }
        });
    </script>
</body>
</html>
