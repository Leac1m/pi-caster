<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AeroBeam Remote</title>
    <link rel="stylesheet" href="style.css">
    <script src="/socket.io/socket.io.js"></script>
    
    <script src="/vendor/jszip.min.js"></script>
    <script src="/vendor/d3.min.js"></script>
    <script src="/vendor/nv.d3.min.js"></script>
    <script src="/vendor/pptxjs.min.js"></script>
</head>
<body class="landing-body" style="align-items: stretch; margin: 0; padding: 0;">
    <div class="remote-container" style="display: flex; flex-direction: column; height: 100vh;">
        <header class="remote-header" style="flex: 0 0 auto;">
            <h2>Remote Control</h2>
            <button id="btn-stop" class="btn danger-btn">Stop</button>
        </header>
        
        <div class="remote-controls">
            <div id="preview-wrapper" class="preview-wrapper">
                <div class="preview-inner">
                    <div id="viewer-container" style="width: 100%; height: 100%; display: none;"></div><p id="preview-loading">Loading Preview...</p>
                </div>
            </div>
            
            <div class="remote-button-group">
                <button id="btn-prev" class="btn secondary-btn control-btn">Previous</button>
                <button id="btn-next" class="btn primary-btn control-btn">Next</button>
            </div>
        </div>
    </div>

    <script>
        window.FileReaderJS = {
            setSync: function() {},
            setupInput: function() {},
            setupDrop: function() {},
            setupBlob: function(blob, options) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    if (options.on && options.on.load) {
                        options.on.load(e, blob);
                    }
                };
                if (options.readAsDefault === "ArrayBuffer") {
                    reader.readAsArrayBuffer(blob);
                } else {
                    reader.readAsText(blob);
                }
            }
        };
        
        const socket = io({
            reconnection: true,
            reconnectionAttempts: Infinity,
            reconnectionDelay: 1000,
            reconnectionDelayMax: 5000
        });

        const headerTitle = document.querySelector('.remote-header h2');
        
        const loadingText = document.getElementById('preview-loading');

        let viewerClient = null;
        let viewerInstance = null;
        let currentPageNum = 1;
        
        import('/vendor/udoc/src/index.js').then(async (mod) => {
            viewerClient = await mod.UDocClient.create({
                baseUrl: '/vendor/udoc/',
                googleFonts: false
            });
            viewerInstance = await viewerClient.createViewer({
                container: '#viewer-container',
                hideToolbar: true,
                hideFloatingToolbar: true,
                disableLeftPanel: true,
                disableRightPanel: true,
                scrollMode: 'continuous',
                zoomMode: 'fit-spread'
            });
            
            // Sync page number
            viewerInstance.on('page-changed', (e) => {
                currentPageNum = e.page;
            });
        }).catch(err => console.error('Failed to load udoc-viewer', err));

        socket.on('connect', () => {
            headerTitle.textContent = 'Remote Control';
            socket.emit('register-remote');
        });

        socket.on('disconnect', () => {
            headerTitle.textContent = 'Disconnected...';
        });

        socket.io.on('reconnect_attempt', () => {
            headerTitle.textContent = 'Reconnecting...';
        });

        socket.on('presentation-start', async (data) => {
            currentPageNum = data.slide || 1;

            loadingText.style.display = 'block';
            document.getElementById('viewer-container').style.display = 'none';

            if (viewerInstance) {
                try {
                    await viewerInstance.load(data.fileUrl);
                    if (data.slide) {
                        viewerInstance.goToPage(data.slide);
                    }
                    loadingText.style.display = 'none';
                    document.getElementById('viewer-container').style.display = 'block';
                } catch (err) {
                    console.error("Error loading document:", err);
                    loadingText.textContent = "Preview unavailable";
                }
            } else {
                loadingText.textContent = "Viewer not initialized";
            }
        });

                // Poll for slides rendering
                const checkReady = setInterval(() => {
                    const slides = $('#pptx-preview .slide');
                    if (slides.length > 0) {
                        clearInterval(checkReady);
                        totalPptxSlides = slides.length;
                        loadingText.style.display = 'none';
                        renderPptxSlide(pageNum);
                    }
                }, 500);

            } else if (pdfJS) {
                pdfCanvas.style.display = 'block';
                pdfJS.getDocument(data.fileUrl).promise.then(doc => {
                    pdfDoc = doc;
                    renderPage(pageNum);
                }).catch(err => {
                    console.error("Error loading PDF preview", err);
                    loadingText.textContent = "Preview unavailable";
                });
            }
        });

        

        document.getElementById('btn-next').addEventListener('click', () => {
            socket.emit('slide-next');
            if (viewerInstance && viewerInstance.isLoaded && viewerInstance.currentPage < viewerInstance.pageCount) {
                viewerInstance.nextPage();
                currentPageNum++;
            }
            if(navigator.vibrate) navigator.vibrate(50);
        });

        document.getElementById('btn-prev').addEventListener('click', () => {
            socket.emit('slide-prev');
            if (viewerInstance && viewerInstance.isLoaded && viewerInstance.currentPage > 1) {
                viewerInstance.previousPage();
                currentPageNum--;
            }
            if(navigator.vibrate) navigator.vibrate(50);
        });

        document.getElementById('btn-stop').addEventListener('click', () => {
            socket.emit('presentation-stop');
            window.location.href = 'index';
        });

        // Keyboard Shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
                e.preventDefault(); // prevent scrolling
                document.getElementById('btn-next').click();
            } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                e.preventDefault();
                document.getElementById('btn-prev').click();
            }
        });
    </script>
</body>
</html>
