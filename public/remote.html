<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AeroBeam Remote</title>
    <link rel="stylesheet" href="style.css">
    <script src="/socket.io/socket.io.js"></script>
    <script src="/vendor/pdf.min.js"></script>
</head>
<body class="landing-body" style="align-items: stretch; margin: 0; padding: 0;">
    <div class="remote-container" style="display: flex; flex-direction: column; height: 100vh; height: 100dvh;">
        <header class="remote-header" style="flex: 0 0 auto;">
            <h2>Remote Control</h2>
            <button id="btn-stop" class="btn danger-btn">Stop</button>
        </header>
        
        <div class="remote-controls">
            <div id="preview-wrapper" class="preview-wrapper">
                <div class="preview-inner">
                    <canvas id="pdf-preview"></canvas>
                    <p id="preview-loading">Loading Preview...</p>
                </div>
            </div>

            <div class="voice-control-section">
                <p id="voice-status" class="voice-status">Tap mic to start voice control</p>
                <div class="voice-btn-wrapper">
                    <button id="btn-voice" class="btn voice-btn" title="Toggle Voice Control">
                        <svg viewBox="0 0 24 24" width="36" height="36" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="mic-icon"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
                    </button>
                    <div class="ripple"></div>
                </div>
            </div>
            
            <div class="remote-button-group">
                <button id="btn-prev" class="btn secondary-btn control-btn">Previous</button>
                <button id="btn-next" class="btn primary-btn control-btn">Next</button>
            </div>
        </div>
    </div>

    <script>
        window.FileReaderJS = {
            setSync: function() {},
            setupInput: function() {},
            setupDrop: function() {},
            setupBlob: function(blob, options) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    if (options.on && options.on.load) {
                        options.on.load(e, blob);
                    }
                };
                if (options.readAsDefault === "ArrayBuffer") {
                    reader.readAsArrayBuffer(blob);
                } else {
                    reader.readAsText(blob);
                }
            }
        };
        
        const socket = io({
            reconnection: true,
            reconnectionAttempts: Infinity,
            reconnectionDelay: 1000,
            reconnectionDelayMax: 5000
        });

        const headerTitle = document.querySelector('.remote-header h2');
        const pdfCanvas = document.getElementById('pdf-preview');
        const pdfCtx = pdfCanvas.getContext('2d');
        const loadingText = document.getElementById('preview-loading');

        // PDF State
        let pdfDoc = null,
            pageNum = 1,
            pageIsRendering = false,
            pageNumIsPending = null;

        const pdfJS = window.pdfjsLib || window['pdfjs-dist/build/pdf'];
        if (pdfJS) {
            pdfJS.GlobalWorkerOptions.workerSrc = '/vendor/pdf.worker.min.js';
        }

        const renderPage = num => {
            if (!pdfDoc) return;
            pageIsRendering = true;

            pdfDoc.getPage(num).then(page => {
                const viewport = page.getViewport({ scale: 1.5 });
                pdfCanvas.height = viewport.height;
                pdfCanvas.width = viewport.width;

                const renderCtx = {
                    canvasContext: pdfCtx,
                    viewport: viewport
                };

                page.render(renderCtx).promise.then(() => {
                    pageIsRendering = false;
                    loadingText.style.display = 'none';
                    pdfCanvas.style.display = 'block';

                    if (pageNumIsPending !== null) {
                        renderPage(pageNumIsPending);
                        pageNumIsPending = null;
                    }
                });
            });
        };

        const queueRenderPage = num => {
            if (pageIsRendering) {
                pageNumIsPending = num;
            } else {
                renderPage(num);
            }
        };

        socket.on('connect', () => {
            headerTitle.textContent = 'Remote Control';
            socket.emit('register-remote');
        });

        socket.on('disconnect', () => {
            headerTitle.textContent = 'Disconnected...';
        });

        socket.io.on('reconnect_attempt', () => {
            headerTitle.textContent = 'Reconnecting...';
        });

        socket.on('presentation-start', (data) => {
            pageNum = data.slide || 1;

            loadingText.style.display = 'block';
            pdfCanvas.style.display = 'none';

            if (pdfJS) {
                pdfCanvas.style.display = 'block';
                pdfJS.getDocument(data.fileUrl).promise.then(doc => {
                    pdfDoc = doc;
                    renderPage(pageNum);
                }).catch(err => {
                    console.error("Error loading PDF preview", err);
                    loadingText.textContent = "Preview unavailable";
                });
            }
        });

        window.addEventListener('resize', () => {
            // Re-render PDF on resize if needed, though canvas scales via CSS mostly
        });

        document.getElementById('btn-next').addEventListener('click', () => {
            socket.emit('slide-next');
            if (pdfDoc && pageNum < pdfDoc.numPages) {
                pageNum++;
                queueRenderPage(pageNum);
            }
            if(navigator.vibrate) navigator.vibrate(50);
        });

        document.getElementById('btn-prev').addEventListener('click', () => {
            socket.emit('slide-prev');
            if (pdfDoc && pageNum > 1) {
                pageNum--;
                queueRenderPage(pageNum);
            }
            if(navigator.vibrate) navigator.vibrate(50);
        });

        document.getElementById('btn-stop').addEventListener('click', () => {
            socket.emit('presentation-stop');
            window.location.href = 'index';
        });

        // Keyboard Shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
                e.preventDefault(); // prevent scrolling
                document.getElementById('btn-next').click();
            } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                e.preventDefault();
                document.getElementById('btn-prev').click();
            }
        });

        // Voice Control Logic
        const btnVoice = document.getElementById('btn-voice');
        const voiceStatus = document.getElementById('voice-status');
        let audioContext, voskSocket, audioStream;

        const updateVoiceStatus = (msg, isError = false) => {
            voiceStatus.textContent = msg;
            voiceStatus.style.color = isError ? '#ef4444' : 'var(--text-muted)';
        };

        btnVoice.addEventListener('click', async () => {
            if (btnVoice.classList.contains('active')) {
                btnVoice.classList.remove('active');
                if (audioContext) await audioContext.close();
                if (voskSocket) voskSocket.close();
                if (audioStream) audioStream.getTracks().forEach(track => track.stop());
                updateVoiceStatus('Tap mic to start voice control');
                return;
            }

            try {
                updateVoiceStatus('Starting voice engine...');
                audioStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                
                audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
                await audioContext.audioWorklet.addModule('/vosk-audio-processor.js');

                const source = audioContext.createMediaStreamSource(audioStream);
                const processor = new AudioWorkletNode(audioContext, 'vosk-audio-processor');

                source.connect(processor);
                processor.connect(audioContext.destination);

                const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                voskSocket = new WebSocket(`${wsProtocol}//${window.location.host}/vosk`);

                voskSocket.onopen = () => {
                    btnVoice.classList.add('active');
                    updateVoiceStatus('Listening...');
                    
                    // Tune Vosk to only listen for our specific keywords
                    voskSocket.send(JSON.stringify({
                        config: {
                            sample_rate: 16000,
                            phrase_list: ["next slide", "previous slide", "[unk]"]
                        }
                    }));

                    processor.port.onmessage = (event) => {
                        if (voskSocket.readyState === WebSocket.OPEN) {
                            voskSocket.send(event.data);
                        }
                    };
                };

                voskSocket.onmessage = (event) => {
                    const result = JSON.parse(event.data);
                    
                    // Show real-time feedback of what it's hearing
                    if (result.partial) {
                        updateVoiceStatus(`Hearing: ${result.partial}`);
                    }

                    // We enforce exact matches to avoid triggering when the user
                    // naturally says "on the next slide..." mid-sentence.
                    if (result.text) {
                        const text = result.text.toLowerCase().trim();
                        if (text === 'next slide') {
                            updateVoiceStatus('Command: Next slide!');
                            document.getElementById('btn-next').click();
                            setTimeout(() => { if (btnVoice.classList.contains('active')) updateVoiceStatus('Listening...'); }, 2000);
                        } else if (text === 'previous slide') {
                            updateVoiceStatus('Command: Previous slide!');
                            document.getElementById('btn-prev').click();
                            setTimeout(() => { if (btnVoice.classList.contains('active')) updateVoiceStatus('Listening...'); }, 2000);
                        } else if (text !== '' && text !== '[unk]') {
                            updateVoiceStatus(`Heard: "${result.text}"`);
                            setTimeout(() => { if (btnVoice.classList.contains('active')) updateVoiceStatus('Listening...'); }, 2000);
                        } else {
                            if (btnVoice.classList.contains('active')) updateVoiceStatus('Listening...');
                        }
                    }
                };

                voskSocket.onerror = (err) => {
                    console.error('Vosk WebSocket Error:', err);
                    updateVoiceStatus('Disconnected from voice server', true);
                    if (btnVoice.classList.contains('active')) btnVoice.click();
                };

            } catch (err) {
                console.error('Error starting voice control:', err);
                updateVoiceStatus('Microphone access denied', true);
            }
        });
    </script>
</body>
</html>
